<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitgate Community Maps</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        input, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
        }
        input {
            width: 100%;
            max-width: 300px;
        }
        input:focus {
            outline: 2px solid var(--accent);
        }
        button.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #000;
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .map-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .map-author {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: var(--accent-hover);
        }
        .no-image {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: #111;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Splitgate Community Maps</h1>
        <p>Browse, search, and download community-made maps instantly.</p>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Search map or author..." oninput="filterMaps()">
        <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
        <button class="filter-btn" onclick="setCategory('Playable', this)">Playable</button>
        <button class="filter-btn" onclick="setCategory('WIP', this)">WIP</button>
        <button class="filter-btn" onclick="setCategory('Unplayable', this)">Unplayable</button>
        <button class="filter-btn" onclick="setCategory('Unsorted', this)">Unsorted</button>
    </div>

    <div class="grid" id="map-grid"></div>
</div>

<script>
    let maps = [];
    let currentCategory = 'All';

    fetch('maps.json')
        .then(res => res.json())
        .then(data => {
            maps = data;
            renderMaps(maps);
        })
        .catch(err => console.error('Could not load maps.json', err));

    function setCategory(category, element) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        filterMaps();
    }

    function filterMaps() {
        const query = document.getElementById('search').value.toLowerCase();
        
        const filtered = maps.filter(map => {
            const matchesCategory = currentCategory === 'All' || map.category === currentCategory;
            const matchesQuery = map.name.toLowerCase().includes(query) || map.author.toLowerCase().includes(query);
            return matchesCategory && matchesQuery;
        });

        renderMaps(filtered);
    }

    function renderMaps(data) {
        const grid = document.getElementById('map-grid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No maps found.</p>';
            return;
        }

        data.forEach(map => {
            const card = document.createElement('div');
            card.className = 'card';

            const imgHtml = map.image 
                ? `<img src="${map.image}" alt="${map.name}" loading="lazy">` 
                : `<div class="no-image">No image</div>`;

            card.innerHTML = `
                ${imgHtml}
                <div class="card-content">
                    <div>
                        <div class="map-title">${map.name}</div>
                        <div class="map-author">by ${map.author} (${map.category})</div>
                    </div>
                    <a href="${map.download}" class="download-btn">📥 Download .bin</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }
</script>

</body>
</html>
