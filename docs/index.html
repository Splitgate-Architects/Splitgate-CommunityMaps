<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Splitgate Community Maps</title>
    <meta name="title" content="Splitgate Community Maps">
    <meta name="description" content="Browse, search, and download community-made Splitgate maps instantly.">
    <meta name="theme-color" content="#3b82f6">

    <!-- Open Graph / Discord / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://splitgate-architects.github.io/Splitgate-CommunityMaps/">
    <meta property="og:title" content="Splitgate Community Maps">
    <meta property="og:description" content="Browse, search, and download community-made maps instantly.">
    <meta property="og:image" content="https://splitgate-architects.github.io/Splitgate-CommunityMaps/assets/default-banner.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Splitgate Community Maps">
    <meta property="twitter:description" content="Browse, search, and download community-made maps instantly.">
    <meta property="twitter:image" content="https://splitgate-architects.github.io/Splitgate-CommunityMaps/assets/default-banner.jpg">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        input, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
        }
        input {
            width: 100%;
            max-width: 300px;
        }
        input:focus {
            outline: 2px solid var(--accent);
        }
        button.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        
        /* Skeleton / Placeholder Look */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            background: #1e293b;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-img-placeholder {
            position: absolute;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 10px;
            text-align: center;
            transition: opacity 0.3s ease-in-out;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: opacity 0.3s ease-in-out;
        }
        .card img.loaded {
            opacity: 1;
        }
        .card img.loaded + .card-img-placeholder {
            opacity: 0;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        .card-img-wrapper:not(:has(img.loaded)) {
            animation: pulse 1.5s infinite ease-in-out;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .map-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .map-author {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        .btn-secondary {
            background: #334155;
        }
        .btn-secondary:hover {
            background: #475569;
        }

        /* Trigger für das Nachladen (unsichtbar) */
        #load-more-trigger {
            height: 20px;
            width: 100%;
            margin-top: 20px;
        }

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 95vw;
            max-height: 95vh;
            width: auto;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            background: rgba(30, 41, 59, 0.95);
        }
        .modal-title-area {
            font-size: 16px;
            font-weight: bold;
        }
        .modal-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }
        .close-btn:hover {
            color: var(--text-color);
        }
        .modal-body {
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            overflow: hidden;
        }
        .modal-body img {
            max-width: 90vw;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
        }
        .nav-arrow:hover {
            background: rgba(59, 130, 246, 0.9);
            transform: translateY(-50%) scale(1.05);
        }
        .prev-arrow { left: 20px; }
        .next-arrow { right: 20px; }
        
        .modal-footer {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.95);
            border-top: 1px solid #334155;
            gap: 10px;
            flex-wrap: wrap;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Splitgate Community Maps</h1>
        <p>Browse, search, and download community-made maps instantly.</p>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Search map or author..." oninput="filterMaps()">
        <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
        <button class="filter-btn" onclick="setCategory('Playable', this)">Playable</button>
        <button class="filter-btn" onclick="setCategory('WIP', this)">WIP</button>
        <button class="filter-btn" onclick="setCategory('Unplayable', this)">Unplayable</button>
        <button class="filter-btn" onclick="setCategory('Unsorted', this)">Unsorted</button>
        <button class="filter-btn" onclick="setCategory('Templates', this)">Templates</button>
    </div>

    <div class="grid" id="map-grid"></div>
    <div id="load-more-trigger"></div>
</div>

<!-- Modal / Lightbox Overlay -->
<div class="modal" id="map-modal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <div class="modal-title-area" id="modal-title">Map Title</div>
                <div class="modal-subtitle" id="modal-subtitle">by Author</div>
            </div>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <button class="nav-arrow prev-arrow" onclick="changeMap(-1)">&#10094;</button>
            <img id="modal-img" src="" alt="Map Preview">
            <button class="nav-arrow next-arrow" onclick="changeMap(1)">&#10095;</button>
        </div>
        <div class="modal-footer">
            <span id="modal-category" style="color: var(--text-muted); font-size: 13px;">Category</span>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="copy-link-btn" onclick="copyMapLink()">🔗 Copy Link</button>
                <a id="modal-download" href="#" class="btn">📥 Download .bin</a>
            </div>
        </div>
    </div>
</div>

<script>
    let maps = [];
    let filteredMaps = [];
    let currentIndex = 0;
    let currentCategory = 'All';
    
    let currentlyRendered = 0;
    const BATCH_SIZE = 24;

    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "800px 0px" });

    const scrollObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && currentlyRendered < filteredMaps.length) {
            loadMoreMaps();
        }
    }, { rootMargin: "400px" });

    fetch('maps.json')
        .then(res => res.json())
        .then(data => {
            maps = data;
            
            const trigger = document.getElementById('load-more-trigger');
            if (trigger) scrollObserver.observe(trigger);

            filterMaps();
            checkUrlHash();
        })
        .catch(err => console.error('Could not load maps.json', err));

    window.addEventListener('hashchange', checkUrlHash);

    function setCategory(category, element) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        filterMaps();
    }

    function filterMaps() {
        const query = document.getElementById('search').value.toLowerCase();
        
        filteredMaps = maps.filter(map => {
            const matchesCategory = currentCategory === 'All' || map.category === currentCategory;
            const matchesQuery = map.name.toLowerCase().includes(query) || map.author.toLowerCase().includes(query);
            return matchesCategory && matchesQuery;
        });

        const grid = document.getElementById('map-grid');
        grid.innerHTML = ''; 
        currentlyRendered = 0;

        if (filteredMaps.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No maps found.</p>';
            document.getElementById('load-more-trigger').style.display = 'none';
            return;
        }

        document.getElementById('load-more-trigger').style.display = 'block';
        loadMoreMaps();
    }

    function loadMoreMaps() {
        const grid = document.getElementById('map-grid');
        const nextBatch = filteredMaps.slice(currentlyRendered, currentlyRendered + BATCH_SIZE);

        nextBatch.forEach((map, index) => {
            const actualIndex = currentlyRendered + index; 
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(actualIndex, true);

            const imgHtml = map.image 
                ? `<div class="card-img-wrapper">
                       <img data-src="${map.image}" alt="${map.name}" onload="this.classList.add('loaded')">
                       <div class="card-img-placeholder">${map.name}</div>
                   </div>` 
                : `<div class="card-img-wrapper"><div class="card-img-placeholder">No image</div></div>`;

            card.innerHTML = `
                ${imgHtml}
                <div class="card-content">
                    <div>
                        <div class="map-title">${map.name}</div>
                        <div class="map-author">by ${map.author} (${map.category})</div>
                    </div>
                    <a href="${map.download}" class="btn" onclick="event.stopPropagation()">📥 Download .bin</a>
                </div>
            `;
            grid.appendChild(card);

            const imgElement = card.querySelector('img[data-src]');
            if (imgElement) {
                imageObserver.observe(imgElement);
            }
        });

        currentlyRendered += nextBatch.length;

        if (currentlyRendered >= filteredMaps.length) {
            document.getElementById('load-more-trigger').style.display = 'none';
        }
    }

    function openModal(index, updateHash = false) {
        currentIndex = index;
        updateModalContent();
        document.getElementById('map-modal').classList.add('active');

        if (updateHash && filteredMaps[currentIndex]) {
            const mapId = filteredMaps[currentIndex].id;
            history.pushState(null, null, `#${mapId}`);
        }
    }

    function closeModal() {
        document.getElementById('map-modal').classList.remove('active');
        history.pushState("", document.title, window.location.pathname + window.location.search);
    }

    function closeModalOnBg(event) {
        if (event.target.id === 'map-modal') {
            closeModal();
        }
    }

    function changeMap(direction) {
        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = filteredMaps.length - 1;
        } else if (currentIndex >= filteredMaps.length) {
            currentIndex = 0;
        }
        updateModalContent();
        
        if (filteredMaps[currentIndex]) {
            const mapId = filteredMaps[currentIndex].id;
            history.replaceState(null, null, `#${mapId}`);
        }
    }

    function updateModalContent() {
        const map = filteredMaps[currentIndex];
        if (!map) return;

        document.getElementById('modal-title').textContent = map.name;
        document.getElementById('modal-subtitle').textContent = `by ${map.author}`;
        document.getElementById('modal-category').textContent = `Category: ${map.category}`;
        document.getElementById('modal-download').href = map.download;

        const imgElement = document.getElementById('modal-img');
        if (map.image) {
            imgElement.src = map.image;
            imgElement.style.display = 'block';
        } else {
            imgElement.style.display = 'none';
        }
    }

    function copyMapLink() {
        const map = filteredMaps[currentIndex];
        if (!map) return;
        
        let basePath = window.location.pathname.replace('index.html', '');
        if (!basePath.endsWith('/')) basePath += '/';
        
        const shareUrl = `${window.location.origin}${basePath}m/${map.id}.html`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
            const btn = document.getElementById('copy-link-btn');
            const originalText = btn.textContent;
            btn.textContent = '✅ Copied!';
            btn.style.background = 'var(--success)';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 2000);
        });
    }

    function checkUrlHash() {
        const hash = window.location.hash.substring(1);
        if (!hash) return;

        const index = maps.findIndex(m => m.id === hash);
        if (index !== -1) {
            currentCategory = 'All';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === 'All');
            });
            
            filterMaps();

            const filteredIndex = filteredMaps.findIndex(m => m.id === hash);
            if (filteredIndex !== -1) {
                while (currentlyRendered <= filteredIndex) {
                    loadMoreMaps();
                }
                
                openModal(filteredIndex, false);
                
                setTimeout(() => {
                    const cards = document.querySelectorAll('.card');
                    if(cards[filteredIndex]) {
                        cards[filteredIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }
    }

    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('map-modal');
        if (!modal.classList.contains('active')) return;

        if (e.key === 'ArrowLeft') {
            changeMap(-1);
        } else if (e.key === 'ArrowRight') {
            changeMap(1);
        } else if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>

</body>
</html>
